# Render Blueprint for Omnix (https://render.com/docs/blueprint-spec)
# Render reads this file when you choose  New → Blueprint  and pick this GitHub repository.
services:
  - type: web
    name: omnix                      # the site address becomes https://omnix.onrender.com (or omnix-xxxx if taken)
    runtime: python
    plan: standard                   # 2 GB RAM. One full analysis uses ~450 MB, so 512 MB plans (Free/Starter) run out of memory
    region: ohio                     # closest Render region to Texas
    branch: main
    autoDeploy: true                 # every push to main redeploys
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash render_start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
    # Secrets (sign-in, Stripe, owner email, access keys, email) are NOT in this file.
    # Add them in the Render dashboard: omnix → Environment → Secret Files → filename  secrets.toml
