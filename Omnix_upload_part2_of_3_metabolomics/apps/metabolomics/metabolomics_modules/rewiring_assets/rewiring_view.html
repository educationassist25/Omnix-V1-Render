<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewiring Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef1ef; --ink:#141a1b; --ink-2:#4b5557; --ink-3:#6f797b;
  --line:#dde2df; --line-strong:#b9c1be; --accent:#00695c; --accent-ink:#ffffff; --focus:#00695c;
  --e-gained:#1baf7a; --e-lost:#4a3aa7; --e-flipped:#e87ba4; --e-intact:#aab3b0;
  --g-a:#2a78d6; --g-b:#eb6834;
  --div-neg:#2a78d6; --div-mid:#f0efec; --div-pos:#e34948;
  --good:#0a7d0a; --warn:#9a6700; --crit:#c03030;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 16px rgba(20,30,30,.05);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101415; --surface:#171c1d; --surface-2:#1e2425; --ink:#eef2f1; --ink-2:#b3bcbc; --ink-3:#8b9596;
    --line:#2a3133; --line-strong:#3d4648; --accent:#4fb8b0; --accent-ink:#0b1414; --focus:#4fb8b0;
    --e-gained:#199e70; --e-lost:#9085e9; --e-flipped:#d55181; --e-intact:#566062;
    --g-a:#3987e5; --g-b:#d95926;
    --div-neg:#3987e5; --div-mid:#383835; --div-pos:#e66767;
    --good:#3fc43f; --warn:#fab219; --crit:#e66767; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101415; --surface:#171c1d; --surface-2:#1e2425; --ink:#eef2f1; --ink-2:#b3bcbc; --ink-3:#8b9596;
  --line:#2a3133; --line-strong:#3d4648; --accent:#4fb8b0; --accent-ink:#0b1414; --focus:#4fb8b0;
  --e-gained:#199e70; --e-lost:#9085e9; --e-flipped:#d55181; --e-intact:#566062;
  --g-a:#3987e5; --g-b:#d95926;
  --div-neg:#3987e5; --div-mid:#383835; --div-pos:#e66767;
  --good:#3fc43f; --warn:#fab219; --crit:#e66767; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:12px 32px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:16px;font-weight:600;line-height:1.3}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}
.fmt{font-size:12px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.report-head{display:flex;flex-direction:column;gap:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.45}
button:focus-visible,.card:focus-visible,tr:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .swatch{display:inline-block;width:18px;vertical-align:middle;margin-right:6px}
/* network gets the full width so full metabolite and pathway names stay readable; pair panel below */
.grid-main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.detail.panel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px 22px;align-items:start}
.detail>*{grid-column:1/-1}
.detail>.pair-plot{grid-column:1}.detail>.pair-side{grid-column:2}
@media (max-width:820px){.detail>.pair-plot,.detail>.pair-side{grid-column:1/-1}}
.net-panel{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.net-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
#net{width:100%;height:auto;display:block;max-width:1080px;margin:0 auto}
.net-ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--ink-2)}
.net-ctl label{display:inline-flex;gap:6px;align-items:center}
.net-ctl select{font:inherit;font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.dl{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.dl button{font:inherit;font-size:12px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
.dl button:hover{border-color:var(--line-strong)}
.fig-foot{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;margin-top:2px}
#net{overflow:visible}
#net .pw-stat{font-weight:400;fill:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:10.5px}
#net text{fill:var(--ink-2);font-size:10.5px;font-family:"IBM Plex Sans",sans-serif}
#net .pw-label{fill:var(--ink);font-size:12.5px;font-weight:600;font-family:"IBM Plex Sans Condensed",sans-serif}
#net .node{stroke:var(--surface);stroke-width:2;cursor:pointer}
#net .node.sel{stroke:var(--ink);stroke-width:2}
#net .edge{fill:none;pointer-events:none}
#net .hit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer;pointer-events:stroke}
#net .dim{opacity:.12}
#net .lab-hi{fill:var(--ink);font-weight:600}
#net .leg-t{fill:var(--ink-2);font-size:12px}
.fc-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.fc-bar{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--div-neg),var(--div-mid),var(--div-pos))}
.detail{padding:14px 16px}
#scatter{width:100%;height:auto;display:block}
#scatter text{fill:var(--ink-2);font-size:11px;font-family:"IBM Plex Sans",sans-serif}
#scatter .axis{stroke:var(--line-strong)}
#scatter .grid{stroke:var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pair-side{display:flex;flex-direction:column;gap:10px}
.kv div{background:var(--surface-2);border-radius:6px;padding:7px 9px;min-width:0}
.kv .k{font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}
.kv .v{font-family:"IBM Plex Mono",monospace;font-size:14px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.class-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px}
.cards-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.rank{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.verdict{font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;display:inline-flex;gap:5px;align-items:center}
.verdict.robust{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.verdict.fragile{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.verdict.mixed{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.verdict.exploratory{color:var(--ink-2);background:var(--surface-2)}
.rx-box{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rx-box .rx-title{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rx-box .rx-names{color:var(--ink-2);font-size:12px}
.ratio-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ratio-row div{background:var(--surface-2);border-radius:6px;padding:6px 8px}
.ratio-row .k{font-size:11.5px;color:var(--ink-3)}
.ratio-row .v{font-family:"IBM Plex Mono",monospace;font-size:14px;font-variant-numeric:tabular-nums}
.rx-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px}
tr.active td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
#net .rxe{fill:none;stroke:var(--ink-3);pointer-events:none}
.card .interp{font-size:13px;color:var(--ink-2)}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.meter .track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter .fill{height:100%;background:var(--accent);display:block}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ic{flex:none;width:16px;text-align:center;font-weight:700}
.checks .ok{color:var(--good)} .checks .bad{color:var(--crit)} .checks .na{color:var(--ink-3)}
.next{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.next b{font-weight:600}
.table-wrap{overflow-x:auto;max-height:420px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none}
td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
th.n{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:10;max-width:280px}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
section{display:flex;flex-direction:column;gap:12px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.card,.chip{transition:border-color .15s,opacity .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip" hidden></div>
<script id="payload" type="application/json">/*__REWIRING_PAYLOAD__*/</script>
<script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById("payload").textContent);
const OPT=D.options||{};
if(OPT.theme==="dark"||OPT.theme==="light")document.documentElement.setAttribute("data-theme",OPT.theme);
const $=id=>document.getElementById(id);
const CLS=[{k:"lost",label:"Lost",dash:"7 4",v:"--e-lost"},{k:"gained",label:"Gained",dash:"",v:"--e-gained"},{k:"flipped",label:"Flipped",dash:"2 3",v:"--e-flipped"},{k:"intact",label:"Intact",dash:"",v:"--e-intact"}];
const clsInfo=k=>CLS.find(c=>c.k===k);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const f2=x=>x==null?"–":(x>=0?"+":"−")+Math.abs(x).toFixed(2);
const fr=x=>x==null?"–":(x<0?"−":"")+Math.abs(x).toFixed(2);
const fq=q=>q==null?"–":(q<1e-4?q.toExponential(1).replace("e-","e−"):q.toFixed(4));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function swatch(k,w=22){const c=clsInfo(k);return `<svg width="${w}" height="8" aria-hidden="true"><line x1="1" y1="4" x2="${w-1}" y2="4" stroke="var(${c.v})" stroke-width="${k==="intact"?2:3}" stroke-dasharray="${c.dash}" stroke-linecap="round"/></svg>`}
function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function divColor(v){const t=Math.max(-1,Math.min(1,(v||0)/1.5));const mid=hexToRgb(css("--div-mid")||"#f0efec"),end=hexToRgb(css(t<0?"--div-neg":"--div-pos")||"#888888");const a=Math.abs(t);return `rgb(${mid.map((m,i)=>Math.round(m+(end[i]-m)*a)).join(",")})`}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;

const F=D.features,G=D.groups,S=D.summary,pairs=D.pairs,cards=D.hypotheses||[],RX=D.reactions||[],PW=D.pathways||[];
const colsA=[],colsB=[];D.group.forEach((g,i)=>(g===0?colsA:colsB).push(i));
const state={show:{lost:true,gained:true,flipped:true,intact:true,reaction:true},sel:null,activeMod:null,activePw:null,sort:{k:"q",dir:1}};
const rew=pairs.filter(p=>p.cls&&p.cls!=="intact");
state.sel=(cards[0]&&cards[0].pairs[0])?findPair(cards[0].pairs[0][0],cards[0].pairs[0][1]):(rew.slice().sort((a,b)=>a.q-b.q)[0]||(D.top_pairs||[])[0]||null);
function findPair(i,j){const a=Math.min(i,j),b=Math.max(i,j);return pairs.find(p=>p.i===a&&p.j===b)||RX.find(p=>p.i===a&&p.j===b)||(D.top_pairs||[]).find(p=>p.i===a&&p.j===b)||null}
function rxInfo(p){if(!p)return null;if(p.rx)return p;const r=RX.find(x=>x.i===p.i&&x.j===p.j);return r||null}
function rxArrow(p){const a=F[p.i].name,b=F[p.j].name;return p.rxd==="a>b"?`${a} → ${b}`:p.rxd==="b>a"?`${b} → ${a}`:`${a} ⇄ ${b}`}

// ---------- skeleton ----------
const notes=(S.notes||[]);
const perm=S.permutation;
$("app").innerHTML=`
  ${OPT.title?`<div class="report-head"><div class="eyebrow">Omnix Metabolomics · Correlation Rewiring Map</div><h1>${esc(OPT.title)}</h1><p class="fmt">${esc(G[0])} (n=${D.n[0]}) vs ${esc(G[1])} (n=${D.n[1]}) · ${D.method==="spearman"?"Spearman":"Pearson"} · ${D.cutoff_on==="p"?(S.fdr_method==="permutation"?"permutation p":"p"):(S.fdr_method==="permutation"?"permutation FDR":"BH FDR")} ≤ ${D.fdr} · |Δr| ≥ ${D.min_delta}${OPT.generated?` · ${esc(OPT.generated)}`:""}</p></div>`:""}
  ${notes.length?`<div class="banner">${notes.map(esc).join("<br>")}</div>`:""}
  <div class="stats" id="stats"></div>
  <div class="toolbar"><div class="chips" id="chips" role="group" aria-label="Edge classes shown"></div><span class="fmt">Node fill: log2 FC (${esc(G[1])} / ${esc(G[0])}) <span class="num">−1.5</span> <span class="fc-bar" style="display:inline-block;vertical-align:middle" aria-hidden="true"></span> <span class="num">+1.5</span></span></div>
  <div class="grid-main">
    <div class="panel net-panel">
      <div class="net-head"><h2>Correlation rewiring network</h2></div>
      ${PW.length?`<div class="net-ctl" role="group" aria-label="Pathways shown"><label>Pathways shown <select id="pwTop">${[5,10,15,20,0].map(v=>`<option value="${v}">${v?"Top "+v:"All"}</option>`).join("")}</select></label><label>ranked by <select id="pwMetric"><option value="p">p-value</option><option value="q">FDR q-value</option></select></label><label>cutoff ≤ <select id="pwCut">${[0.001,0.01,0.05,0.1,0.2,0.25,0.5,1].map(v=>`<option value="${v}">${v}</option>`).join("")}</select></label></div>`:""}
      <p class="fmt" id="netNote"></p>
      <p class="muted" style="font-size:13px">Click an edge, node or table row to inspect a pair. Click a hypothesis card to highlight its module.</p>
      <svg id="net" viewBox="-520 -460 1040 920" role="img" aria-label="Circular network of metabolites with rewired correlation edges"></svg>
      <div class="fig-foot" id="netDl"></div>
    </div>
    <div class="panel detail" id="detail"></div>
  </div>
  <section>
    <div class="cards-head"><h2>Hypothesis cards</h2><p class="fmt">Ranked by effect size × robustness. Each card is a hypothesis to test, built from the pairs listed under Evidence.</p></div>
    <div class="cards" id="cards"></div>
  </section>
  ${(D.pathways||[]).length?`<section class="panel" style="padding:14px 16px"><div class="cards-head"><h2>Pathway-level rewiring</h2><p class="fmt">${esc(S.pathway_library||"")} pathways with ≥3 measured members. Statistic: mean z² of the pairs inside the pathway vs. the same label permutations; FDR q-value = Benjamini–Hochberg across pathways. Click a row to highlight its metabolites.</p></div><div class="table-wrap"><table id="ptbl"><thead></thead><tbody></tbody></table></div></section>`:""}
  ${OPT.show_table===false?"":`<section class="panel" style="padding:14px 16px"><div class="cards-head"><h2>Rewired pairs</h2><span class="fmt" id="table-count"></span></div><div class="table-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div></section>`}
`;

function renderStats(){
  const c=S.counts||{};
  const p=perm?`<span class="v">${perm.p_value<0.01?"&lt;0.01":perm.p_value.toFixed(3)}</span><span class="k">Global rewiring p-value (${perm.exact?`exact, all ${perm.n_permutations} label splits`:`${perm.n_permutations} permutations`}${perm.stratified_by_batch?", within batch":""})</span>`:`<span class="v muted">–</span><span class="k">Global permutation test not run</span>`;
  const rl=S.reaction_links||{};
  $("stats").innerHTML=`
  <div class="stat"><span class="v">${S.n_features}</span><span class="k">Metabolites · ${D.n[0]} ${esc(G[0])} / ${D.n[1]} ${esc(G[1])}</span></div>
  <div class="stat"><span class="v">${c.lost||0}</span><span class="k"><span class="swatch">${swatch("lost",18)}</span>Couplings lost</span></div>
  <div class="stat"><span class="v">${c.gained||0}</span><span class="k"><span class="swatch">${swatch("gained",18)}</span>Couplings gained</span></div>
  <div class="stat"><span class="v">${c.flipped||0}</span><span class="k"><span class="swatch">${swatch("flipped",18)}</span>Sign flips</span></div>
  <div class="stat"><span class="v">${rl.rewired_with_reaction||0}</span><span class="k">Rewired pairs linked by a reaction (of ${(rl.direct||0)+(rl.two_step||0)} measured reaction pairs)</span></div>
  <div class="stat"><span class="v">${S.n_pathways_tested?`${S.n_pathways_significant||0}<span class="muted" style="font-size:14px"> / ${S.n_pathways_tested}</span>`:"–"}</span><span class="k">Pathways rewired (FDR q-value &lt; 0.05)</span></div>
  <div class="stat"><span class="v">${S.hidden_rewired_features||0}</span><span class="k">Rewired metabolites with no significant fold change</span></div>
  <div class="stat">${p}</div>`;
}
function renderChips(){
  const c=S.counts||{};
  $("chips").innerHTML=CLS.map(x=>{const n=x.k==="intact"?pairs.filter(p=>p.cls==="intact").length:(c[x.k]||0);return `<button type="button" class="chip" data-k="${x.k}" aria-pressed="${state.show[x.k]}">${swatch(x.k)}<span>${x.label}</span><span class="num muted">${n}</span></button>`}).join("")+(RX.length?`<button type="button" class="chip" data-k="reaction" aria-pressed="${state.show.reaction}"><svg width="22" height="8" aria-hidden="true"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--ink-3)" stroke-width="1.5"/><path d="M15 1 L21 4 L15 7" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/></svg><span>Reactions</span><span class="num muted">${RX.length}</span></button>`:"");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.show[b.dataset.k]=!state.show[b.dataset.k];renderChips();renderNet();renderTable()});
}

// ---------- network ----------

// Minimal encoders so every format downloads straight from the view (no server round trip):
// TIFF = uncompressed RGB, 300 dpi tag; PDF = one page holding the high-resolution JPEG render.
function tiffBytes(img,w,h){

  v.setUint32(ifd+2+n*12,0,true);[8,8,8].forEach((b,k)=>v.setUint16(bps+2*k,b,true));

  const px=img.data;let o=data;for(let k=0;k<px.length;k+=4){u[o++]=px[k];u[o++]=px[k+1];u[o++]=px[k+2]}

function pdfBytes(jpeg,pw,ph,wpt,hpt){

  const add=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(k,body)=>{offs[k]=len;add(`${k} 0 obj\n${body}\nendobj\n`)};
  const W=wpt.toFixed(2),H=hpt.toFixed(2);const content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  add("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);add(jpeg);add("\nendstream\nendobj\n");
  obj(5,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const x=len;add(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(k=>String(offs[k]).padStart(10,"0")+" 00000 n \n").join("")}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`);

function exportFig(which,fmt){

  const base=which==="net"?"Rewiring_Network":("Correlation_"+(state.sel?(F[state.sel.i].name+"_vs_"+F[state.sel.j].name):"pair")).replace(/[^A-Za-z0-9_.-]+/g,"_");
  if(fmt==="svg")return saveBlob(new Blob([m.text],{type:"image/svg+xml"}),base+".svg");
  const img=new Image();const scale=Math.max(2,Math.round(2400/m.w));
  img.onload=()=>{const c=document.createElement("canvas");c.width=Math.round(m.w*scale);c.height=Math.round(m.h*scale);const g=c.getContext("2d");
    g.fillStyle="#ffffff";g.fillRect(0,0,c.width,c.height);g.scale(scale,scale);g.drawImage(img,0,0);
    if(fmt==="png")return c.toBlob(b=>saveBlob(b,base+".png"),"image/png");
    if(fmt==="jpeg")return c.toBlob(b=>saveBlob(b,base+".jpg"),"image/jpeg",0.95);
    if(fmt==="tiff")return saveBlob(tiffBytes(g.getImageData(0,0,c.width,c.height),c.width,c.height),base+".tif");
    if(fmt==="pdf")return c.toBlob(b=>b.arrayBuffer().then(ab=>saveBlob(pdfBytes(new Uint8Array(ab),c.width,c.height,m.w*0.75,m.h*0.75),base+".pdf")),"image/jpeg",0.95);
  };

}

  const t=$("pwTop"),mt=$("pwMetric"),c=$("pwCut");if(!t)return;

  const cuts=[...c.options].map(o=>+o.value);c.value=String(cuts.reduce((b,v)=>Math.abs(v-NET.cutoff)<Math.abs(b-NET.cutoff)?v:b,cuts[0]));
  const upd=()=>{NET.top=+t.value;NET.metric=mt.value;NET.cutoff=+c.value;state.activePw=null;L=layout();renderNet();renderPw()};
  t.onchange=upd;mt.onchange=upd;c.onchange=upd;
}
wireNetControls();
// web fonts change text widths: re-measure and re-fit the network once they have loaded
try{document.fonts&&document.fonts.ready.then(()=>{renderNet()})}catch(e){}
$("netDl").innerHTML=dlButtons("net","Download network");renderStats();renderChips();renderNet();renderDetail();renderCards();renderTable();renderPw();
const rerender=()=>renderNet();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",rerender)}catch(e){}
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
window.__rewiringReady=true;
})();
